<style>
:root{
  --brand:#0F6CBD; --brand-hover:#115EA3; --brand-pressed:#0C3B5E;
  --brand-sel:color-mix(in srgb,var(--brand) 17%,#fff);
  --brand-sel-hover:color-mix(in srgb,var(--brand) 24%,#fff);
  --brand-tint:color-mix(in srgb,var(--brand) 8%,#fff);
  --header:var(--brand);
  --fg1:#242424; --fg2:#424242; --fg3:#616161; --fg4:#707070; --fgd:#BDBDBD;
  --bg1:#fff; --bg2:#FAFAFA; --bg3:#F5F5F5; --bg4:#F0F0F0; --bg5:#EBEBEB; --bg6:#E6E6E6;
  --canvas:#F0F0F0;
  --hover:#F5F5F5; --pressed:#E0E0E0;
  --s1:#D1D1D1; --s2:#E0E0E0; --s3:#F0F0F0;
  --sh2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --sh4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);
  --sh8:0 0 2px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.14);
  --sh16:0 0 2px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.14);
  --sh28:0 0 8px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.14);
  --sh64:0 0 8px rgba(0,0,0,.12),0 32px 64px rgba(0,0,0,.14);
  --red:#C50F1F; --flag:#D13438; --green:#107C10; --purple:#8764B8;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
  --listw:400px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--fg1);background:var(--canvas);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
a{color:var(--brand-hover)}
.hidden{display:none!important}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#C2C2C2;border:4px solid transparent;border-radius:8px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#9E9E9E;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;flex-direction:column;height:100vh;min-width:960px}

/* ---------------- header ---------------- */
.hdr{height:48px;flex:none;background:var(--header);color:#fff;display:flex;align-items:center;position:relative;z-index:5}
.hdr-left{display:flex;align-items:center;height:100%}
.hbtn{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.hbtn:hover{background:rgba(0,0,0,.12)}
.hbtn:active,.hbtn.on{background:rgba(0,0,0,.22)}
.hdr-title{font-size:16px;font-weight:600;padding:0 12px 0 2px;letter-spacing:-.1px;cursor:default}
.hdr-center{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:clamp(260px,36vw,560px)}
.search{position:relative;height:32px;border-radius:4px;background:rgba(255,255,255,.86);display:flex;align-items:center;color:var(--fg1);transition:background .1s}
.search:hover{background:rgba(255,255,255,.94)}
.search.focus{background:#fff;box-shadow:var(--sh8);border-radius:4px 4px 0 0}
.search .s-ic{width:36px;display:grid;place-items:center;color:var(--brand)}
.search .s-back{width:32px;height:32px;display:grid;place-items:center;color:var(--fg2);margin-left:2px}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:14px}
.search input::placeholder{color:var(--fg3)}
.search .s-tool{width:32px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--fg2);margin-right:2px}
.search .s-tool:hover{background:var(--hover)}
.s-pop{position:absolute;left:0;right:0;top:32px;background:#fff;border-radius:0 0 8px 8px;box-shadow:var(--sh16);padding:6px 0 8px;color:var(--fg1);clip-path:inset(0 -20px -30px -20px)}
.s-pop .sp-h{font-size:12px;font-weight:600;color:var(--fg2);padding:8px 16px 4px}
.s-pop .sp-i{display:flex;align-items:center;gap:12px;padding:6px 16px;cursor:pointer;min-height:36px}
.s-pop .sp-i:hover,.s-pop .sp-i.act{background:var(--hover)}
.s-pop .sp-i .sp-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-pop .sp-i .sp-s{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-pop .sp-ic{width:32px;display:grid;place-items:center;color:var(--fg3)}
.s-pop mark{background:none;color:inherit;font-weight:600}
.hdr-right{margin-left:auto;display:flex;align-items:center;height:100%}
.hdr-av{width:48px;height:48px;display:grid;place-items:center}
.hdr-av:hover{background:rgba(0,0,0,.12)}
.hdr-av .av{box-shadow:0 0 0 1px rgba(255,255,255,.6)}

/* ---------------- avatars ---------------- */
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;flex:none;position:relative;user-select:none;letter-spacing:.2px}
.av24{width:24px;height:24px;font-size:10px}
.av28{width:28px;height:28px;font-size:11px}
.av32{width:32px;height:32px;font-size:12px}
.av36{width:36px;height:36px;font-size:13px}
.av40{width:40px;height:40px;font-size:14px}
.av56{width:56px;height:56px;font-size:20px}
.av72{width:72px;height:72px;font-size:26px}
.pres{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-sizing:content-box}
.av40 .pres{right:-1px;bottom:-1px}
.pres.available{background:#13A10E}
.pres.busy{background:#D13438}
.pres.away{background:#F8D22A}
.pres.oof{background:#fff;box-shadow:inset 0 0 0 1.5px #B4009E}

/* ---------------- app rail ---------------- */
.body{flex:1;display:flex;min-height:0}
.rail{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rbtn{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:var(--fg2);position:relative}
.rbtn:hover{background:var(--bg6);color:var(--fg1)}
.rbtn.sel{color:var(--brand);background:#fff;box-shadow:var(--sh2)}
.rbtn.sel::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--brand)}
.rail .r-sep{height:1px;width:24px;background:var(--s1);margin:4px 0}
.rbtn .badge{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px var(--canvas)}

/* ---------------- ribbon ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ribbon{flex:none;padding:0 8px 0 0}
.rb-tabs{height:40px;display:flex;align-items:center;gap:2px}
.rb-nav{width:36px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--fg2);margin-right:6px}
.rb-nav:hover{background:var(--bg6)}
.rb-tab{height:32px;padding:0 10px;border-radius:4px;position:relative;color:var(--fg2);white-space:nowrap}
.rb-tab:hover{background:var(--bg6);color:var(--fg1)}
.rb-tab.sel{color:var(--fg1);font-weight:600}
.rb-tab.sel::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:3px;border-radius:2px;background:var(--brand)}
.rb-tab.ctx{color:var(--brand)}
.rb-bar{height:40px;background:#fff;border-radius:8px;box-shadow:var(--sh4);display:flex;align-items:center;padding:0 4px;margin:0 0 8px;overflow:hidden;position:relative}
.rb-items{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.rbi{height:32px;display:inline-flex;align-items:center;gap:5px;padding:0 6px;border-radius:4px;white-space:nowrap;color:var(--fg1);flex:none}
.rbi:hover{background:var(--hover)}
.rbi:active{background:var(--pressed)}
.rbi.dis{color:var(--fgd);pointer-events:none}
.rbi.dis .ic{color:var(--fgd)!important}
.rbi .ic{display:grid;place-items:center}
.rbi .dd{color:var(--fg3);margin-left:-1px}
.rbi.on{background:var(--bg5)}
.rb-sep{width:1px;height:20px;background:var(--s2);margin:0 4px;flex:none}
.rb-primary{display:inline-flex;height:32px;border-radius:4px;background:var(--brand);color:#fff;flex:none;margin-right:4px}
.rb-primary button{display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;font-weight:600;color:#fff;border-radius:4px 0 0 4px}
.rb-primary .rp-dd{padding:0 6px;border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,.35)}
.rb-primary button:hover{background:var(--brand-hover)}
.rb-primary button:active{background:var(--brand-pressed)}
.rb-end{display:flex;align-items:center;flex:none}
.rb-fontbox{height:28px;border:1px solid var(--s1);border-radius:4px;display:inline-flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;gap:4px;flex:none;color:var(--fg1);background:#fff}
.rb-fontbox:hover{border-color:#B3B3B3}

/* ---------------- panes ---------------- */
.panes{flex:1;display:flex;min-height:0;padding:0 8px 8px 0}
.panes.bottom .mailsplit{flex-direction:column}
.fpane{width:236px;flex:none;overflow-y:auto;overflow-x:hidden;padding:0 6px 16px 0}
.fpane.closed{display:none}
.mailsplit{flex:1;display:flex;min-width:0;min-height:0}
.lpane{width:var(--listw);flex:none;background:#fff;border-radius:8px;box-shadow:var(--sh2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panes.bottom .lpane{width:auto;height:44%}
.panes.off .lpane{width:auto;flex:1}
.panes.off.reading .lpane{display:none}
.splitter{width:8px;flex:none;cursor:col-resize;position:relative}
.splitter:hover::after{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--s1)}
.panes.bottom .splitter{width:auto;height:8px;cursor:row-resize}
.panes.off .splitter{display:none}
.rpane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border-radius:8px;box-shadow:var(--sh2);overflow:hidden}
.panes.off:not(.reading) .rpane{display:none}

/* folder pane */
.fsec{margin-bottom:6px}
.fhead{display:flex;align-items:center;height:32px;padding:0 6px 0 0;border-radius:4px;cursor:pointer;font-weight:600;color:var(--fg1);user-select:none}
.fhead:hover{background:var(--bg6)}
.fhead .chev{width:28px;display:grid;place-items:center;color:var(--fg2)}
.fhead .fh-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem{display:flex;align-items:center;height:32px;padding:0 10px 0 26px;border-radius:4px;cursor:pointer;gap:10px;color:var(--fg1);user-select:none;position:relative}
.fitem:hover{background:var(--bg6)}
.fitem.sel{background:#fff;box-shadow:var(--sh2);font-weight:600}
.fitem .fi{color:var(--fg2);display:grid;place-items:center}
.fitem.sel .fi{color:var(--brand)}
.fitem .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .fc{font-size:13px;color:var(--brand);font-weight:600}
.fitem .fc.n{color:var(--fg3);font-weight:400}
.fitem.unr .fn{font-weight:600}
.fitem.sub{padding-left:46px}
.fitem.drop{background:var(--brand-sel);outline:1px dashed var(--brand)}
.flink{display:block;height:32px;line-height:32px;padding-left:56px;color:var(--brand-hover);cursor:pointer;border-radius:4px;white-space:nowrap}
.flink:hover{background:var(--bg6);text-decoration:underline}
.fgroup .fi{color:var(--fg2)}

/* list pane */
.lhead{flex:none;display:flex;align-items:center;height:48px;padding:0 6px 0 4px;gap:2px;border-bottom:1px solid var(--s3)}
.icb{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--fg2);flex:none}
.icb:hover{background:var(--hover);color:var(--fg1)}
.icb:active{background:var(--pressed)}
.icb.on{color:var(--brand)}
.pivot{display:flex;align-items:center;height:100%}
.pv{height:32px;padding:0 10px;position:relative;color:var(--fg2);border-radius:4px}
.pv:hover{color:var(--fg1)}
.pv:hover::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:2px;background:var(--s1)}
.pv.sel{color:var(--fg1);font-weight:600}
.pv.sel::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:2px;background:var(--brand)}
.lh-title{font-size:16px;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.lh-title .star{color:var(--fg3)}
.lh-right{margin-left:auto;display:flex;align-items:center}
.lbody{flex:1;overflow-y:auto;overflow-x:hidden;outline:0}
.lg{display:flex;align-items:center;gap:4px;height:36px;padding:6px 12px 0 8px;font-size:12px;font-weight:600;color:var(--fg2);cursor:pointer;user-select:none}
.lg .chev{color:var(--fg3);width:16px;display:grid;place-items:center}
.lg:hover{color:var(--fg1)}
.mi{position:relative;display:flex;padding:10px 12px 10px 0;cursor:pointer;user-select:none;border-bottom:1px solid #F3F3F3}
.mi:hover{background:var(--hover)}
.mi.sel{background:var(--brand-sel)}
.mi.sel:hover{background:var(--brand-sel-hover)}
.mi .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);display:none}
.mi.unread .bar{display:block}
.mi .gut{width:24px;flex:none;display:flex;justify-content:center;padding-top:6px;color:var(--fg2)}
.mi .gut button{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--fg2)}
.mi .gut button:hover{background:var(--bg5)}
.mi .gut button.open svg{transform:rotate(90deg)}
.mi .avw{width:32px;height:32px;flex:none;margin:2px 12px 0 0;position:relative}
.mi .avw .ck{position:absolute;inset:0;border-radius:50%;display:none;place-items:center;background:#fff;color:var(--fg3);box-shadow:inset 0 0 0 1px var(--s1)}
.mi .avw:hover .ck{display:grid}
.mi.checked .avw .ck{display:grid;background:var(--brand);color:#fff;box-shadow:none}
.mi .mm{flex:1;min-width:0}
.mi .l{display:flex;align-items:center;min-width:0;height:20px;gap:4px}
.mi .from{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .subj{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .time{font-size:12px;color:var(--fg3);white-space:nowrap;flex:none;margin-left:6px}
.mi .prev{color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.mi.unread .from{font-weight:600}
.mi.unread .subj{font-weight:600;color:var(--brand)}
.mi.unread .time{font-weight:600;color:var(--brand)}
.mi .ind{display:flex;align-items:center;gap:2px;color:var(--fg3);flex:none}
.mi .ind .imp{color:var(--red)}
.mi .ind .rep{color:var(--purple)}
.mi .flags{display:flex;align-items:center;gap:2px;flex:none}
.mi .flags .f{color:var(--flag)}
.mi .flags .p{color:var(--fg2)}
.mi .acts{display:none;align-items:center;flex:none;margin:-6px -6px -6px 0}
.mi:hover .acts{display:flex}
.mi:hover .flags{display:none}
.mi .acts button{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--fg2)}
.mi .acts button:hover{background:rgba(0,0,0,.06);color:var(--brand)}
.mi .acts button.fl:hover{color:var(--flag)}
.mi .acts button.fl.on{color:var(--flag)}
.mi .acts button.pn.on{color:var(--brand)}
.draftlbl{color:var(--red);flex:none}
.mi .chips{display:flex;gap:6px;margin-top:6px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border:1px solid var(--s2);border-radius:14px;background:#fff;font-size:12px;color:var(--fg1);max-width:200px;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--hover)}
.mi .inv{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--fg2)}
.mi .inv .when{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.rsvp{height:24px;padding:0 8px;border:1px solid var(--s1);border-radius:4px;background:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;flex:none}
.rsvp:hover{background:var(--hover)}
.cats{display:flex;gap:4px;flex:none}
.cat{height:18px;line-height:16px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.sub-mi{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 68px;cursor:pointer;font-size:13px;border-bottom:1px solid #F7F7F7;color:var(--fg2)}
.sub-mi:hover{background:var(--hover)}
.sub-mi .sm-f{flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg1)}
.sub-mi .sm-p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg3)}
.sub-mi .sm-t{font-size:12px;color:var(--fg3);flex:none}
.d-roomy .mi{padding-top:14px;padding-bottom:14px}
.d-compact .mi{padding-top:5px;padding-bottom:5px}
.d-compact .mi .avw{display:none}
.d-compact .mi .l3{display:none}
.d-compact .mi .chips{display:none}
.noimg .mi .avw{display:none}
.noprev .mi .l3{display:none}
mark.hl{background:#FFF100;color:inherit;border-radius:1px}
.lempty{display:flex;flex-direction:column;align-items:center;padding:56px 24px;text-align:center;color:var(--fg2)}
.lempty .t1{font-size:16px;font-weight:600;color:var(--fg1);margin-top:16px}
.lempty .t2{margin-top:4px}
.lsel{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--brand-tint);border-bottom:1px solid var(--s3);font-weight:600}

/* reading pane */
.rp-scroll{flex:1;overflow:auto;padding-bottom:28px}
.rp-subj{display:flex;align-items:flex-start;gap:8px;padding:18px 24px 14px}
.rp-subj h1{margin:0;font-size:20px;line-height:28px;font-weight:600;flex:1;min-width:0;word-wrap:break-word}
.rp-subj .cats{margin-top:5px}
.mc{background:#fff;border-radius:8px;box-shadow:var(--sh4);margin:0 20px 12px;padding:16px 20px 18px}
.mc-head{display:flex;gap:12px;align-items:flex-start}
.mc-who{flex:1;min-width:0;padding-top:1px}
.mc-from{font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-from .nm{font-weight:600;color:var(--fg1)}
.mc-from .em{color:var(--fg3)}
.mc-to{font-size:12px;line-height:16px;color:var(--fg2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;margin:-4px -8px 0 0}
.mc-acts{display:flex;align-items:center}
.mc-acts .icb.rp{color:var(--purple)}
.mc-acts .icb.fw{color:var(--brand)}
.mc-date{font-size:12px;color:var(--fg3);white-space:nowrap;padding-right:8px}
.mc-banner{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding:6px 10px;border-radius:4px;background:var(--bg3);font-size:13px;color:var(--fg2)}
.mc-banner.warn{background:#FFF9F5;border:1px solid #FDCFB4}
.mc-banner.junk{background:#FFF4CE;border:1px solid #F7E28B;color:#3E3A00}
.mc-banner .bl{margin-left:auto;display:flex;gap:12px}
.mc-banner .bl a{font-weight:600;cursor:pointer;text-decoration:none}
.mc-atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.att{display:flex;align-items:center;gap:10px;width:228px;height:52px;padding:0 6px 0 10px;border:1px solid var(--s2);border-radius:6px;background:#fff;cursor:pointer}
.att:hover{background:var(--hover);border-color:var(--s1)}
.att .an{font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .as{font-size:12px;line-height:16px;color:var(--fg3)}
.att .ai{flex:1;min-width:0}
.att .icb{width:28px;height:28px}
.att-all{font-size:13px;color:var(--fg2);margin-top:8px}
.att-all a{color:var(--brand-hover);cursor:pointer;margin-right:14px}
.mc-body{margin-top:18px;overflow-x:auto;word-wrap:break-word;color:#000}
.mc-body p{margin:0 0 1em}
.mc-body ul,.mc-body ol{margin:0 0 1em;padding-left:2.2em}
.mc-body li{margin:0 0 .2em}
.mc-body .sig{color:#555;font-size:.88em;line-height:1.35;margin-top:1.4em}
.mc-body table.grid{border-collapse:collapse;margin:0 0 1em}
.mc-body table.grid th,.mc-body table.grid td{border:1px solid #BFBFBF;padding:4px 10px;text-align:left;vertical-align:top}
.mc-body table.grid th{background:#DEEAF6}
.f-aptos{font-family:Aptos,Calibri,Carlito,"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;font-size:12pt;line-height:1.38}
.f-calibri{font-family:Calibri,Carlito,Aptos,"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;font-size:11pt;line-height:1.35}
.f-sys{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
.fwdhdr{border-top:1px solid #E1E1E1;padding-top:10px;margin:14px 0 14px;font-size:11pt}
.joinblock{margin-top:1.2em;color:#242424;font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;font-size:14px}
.joinblock p{margin:0 0 10px}
.joinblock .jb-line{height:1px;background:#D1D1D1;margin:14px 0;max-width:520px}
.joinblock a{color:#5B5FC7;font-weight:600}
.joinblock .jb-small a{font-weight:400;font-size:12px}
.sysmail{max-width:600px;border:1px solid #E1E1E1;border-radius:4px;overflow:hidden;background:#fff}
.sys-hdr{background:#2B579A;color:#fff;font-weight:600;font-size:15px;padding:14px 22px}
.sys-hdr.it{background:#1F3B57}
.sys-hdr.exp{background:#0B6A5C}
.sys-hdr.learn{background:#6B3FA0}
.sys-hdr.hr{background:#A4373A}
.sys-hdr.pulse{background:#C2591B}
.sys-hdr.tt{background:#3C4A5A}
.sys-in{padding:18px 22px 6px}
.sys-in h2{font-size:20px;font-weight:600;margin:0 0 14px}
.kv{border-collapse:collapse;margin:0 0 1em;font-size:13px;width:100%}
.kv th{text-align:left;font-weight:600;color:#555;padding:6px 14px 6px 0;width:150px;vertical-align:top;border-bottom:1px solid #EEE}
.kv td{padding:6px 0;border-bottom:1px solid #EEE}
.sys-btn{display:inline-block;background:#0F6CBD;color:#fff!important;text-decoration:none;font-weight:600;padding:8px 18px;border-radius:4px;margin:6px 0}
.sys-foot{font-size:12px;color:#777;border-top:1px solid #EEE;padding-top:10px;margin-top:10px}
.news{max-width:620px;border:1px solid #E1E1E1;border-radius:6px;overflow:hidden;font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.news-hero{background:linear-gradient(120deg,#0F548C,#2886DE);color:#fff;padding:26px 26px 22px}
.news-hero.alt{background:linear-gradient(120deg,#5C2E91,#C239B3)}
.nh-k{font-size:12px;letter-spacing:2px;font-weight:600;opacity:.85}
.nh-t{font-size:24px;font-weight:600;line-height:1.25;margin-top:6px}
.nh-d{font-size:13px;opacity:.85;margin-top:6px}
.news-sec{padding:16px 26px 4px;border-bottom:1px solid #F0F0F0}
.news-sec h3{margin:0 0 8px;font-size:16px}
.news .sys-foot{margin:0;padding:12px 26px;border:0}
.hist{display:inline-grid;place-items:center;width:30px;height:18px;border:1px solid var(--s1);border-radius:3px;color:var(--fg2);margin:0 0 6px;background:#fff}
.hist:hover{background:var(--hover)}
.quoted{border-top:1px solid #E1E1E1;padding-top:12px;margin-top:6px}
.quoted .qh{font-size:11pt;margin-bottom:12px}
.mc-foot{display:flex;gap:8px;margin-top:22px}
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid var(--s1);border-radius:4px;background:#fff;font-weight:600;color:var(--fg1);white-space:nowrap}
.btn:hover{background:var(--hover);border-color:#C7C7C7}
.btn:active{background:var(--pressed)}
.btn .rp{color:var(--purple)}
.btn .fw{color:var(--brand)}
.btn.pri{background:var(--brand);border-color:transparent;color:#fff}
.btn.pri:hover{background:var(--brand-hover)}
.btn.pri:active{background:var(--brand-pressed)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.mc.col{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:12px}
.mc.col:hover{background:#FCFCFC}
.mc.col .cw{flex:1;min-width:0}
.mc.col .cf{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.col .cp{color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mc.col .cd{font-size:12px;color:var(--fg3);flex:none;align-self:flex-start;margin-top:2px}
.rp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--fg2);padding:24px}
.rp-empty .t1{font-size:20px;font-weight:600;color:var(--fg1);margin-top:20px}
.rp-empty .t2{margin-top:6px}
.backbar{display:flex;align-items:center;gap:4px;padding:8px 12px 0}

/* invite card */
.invc{margin-top:16px;border:1px solid var(--s2);border-radius:8px;display:flex;overflow:hidden}
.invc .il{flex:1;min-width:0;padding:14px 16px}
.invc .ir{width:220px;flex:none;border-left:1px solid var(--s2);background:var(--bg2);padding:10px 12px;position:relative}
.inv-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:14px}
.inv-row .ii{color:var(--fg2);padding-top:0}
.inv-row .it{min-width:0}
.inv-row .it b{font-weight:600}
.inv-row .ix{color:var(--fg3);font-size:12px}
.inv-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.inv-btns .btn .ok{color:var(--green)}
.inv-btns .btn .tn{color:var(--purple)}
.inv-btns .btn .no{color:var(--red)}
.inv-resp{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.minical{position:relative;height:200px;margin-top:6px}
.minical .mh{position:absolute;left:0;right:0;border-top:1px solid var(--s2);font-size:11px;color:var(--fg3)}
.minical .mh span{position:absolute;top:-8px;left:0;background:var(--bg2);padding-right:4px}
.minical .me{position:absolute;left:40px;right:0;border-radius:4px;padding:2px 6px;font-size:11px;line-height:14px;overflow:hidden;border-left:3px solid;white-space:nowrap;text-overflow:ellipsis}
.ir-h{font-size:12px;font-weight:600;color:var(--fg2)}
.respline{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;background:var(--bg3);border-radius:6px}

/* compose */
.cmp{background:#fff;border-radius:8px;box-shadow:var(--sh4);margin:12px 20px 12px;padding:12px 16px 10px;display:flex;flex-direction:column}
.cmp.full{flex:1;min-height:420px}
.cmp-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.split{display:inline-flex;height:32px;border-radius:4px;background:var(--brand);color:#fff}
.split button{color:#fff;font-weight:600;display:flex;align-items:center}
.split .sm{padding:0 14px;border-radius:4px 0 0 4px}
.split .sd{padding:0 6px;border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,.35)}
.split button:hover{background:var(--brand-hover)}
.cmp-row{display:flex;align-items:center;min-height:38px;border-bottom:1px solid var(--s2);gap:8px;position:relative}
.cmp-lbl{height:26px;padding:0 9px;border:1px solid var(--s1);border-radius:4px;display:inline-flex;align-items:center;flex:none;color:var(--fg1)}
.cmp-lbl:hover{background:var(--hover)}
.rcpts{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0;padding:4px 0}
.rcpts input{flex:1;min-width:120px;border:0;outline:0;height:26px;background:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 2px;border-radius:13px;background:var(--bg4);font-size:13px;max-width:260px}
.pill:hover{background:var(--bg6)}
.pill .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .px{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--fg2)}
.pill .px:hover{background:rgba(0,0,0,.08)}
.cmp-cc{display:flex;gap:2px;flex:none}
.cmp-cc button{padding:0 8px;height:28px;border-radius:4px;color:var(--fg2)}
.cmp-cc button:hover{background:var(--hover);color:var(--fg1)}
.cmp-subj{flex:1;border:0;outline:0;height:36px;font-size:14px;background:transparent}
.cmp-subj::placeholder{color:var(--fg3)}
.cmp-body{flex:1;min-height:180px;outline:0;padding:14px 2px;overflow:auto;color:#000;cursor:text}
.cmp-body:empty::before{content:attr(data-ph);color:var(--fg3)}
.cmp-foot{display:flex;align-items:center;gap:6px;padding-top:6px;color:var(--fg3);font-size:12px}
.cmp-foot .sp{flex:1}
.cmp-err{color:var(--red);font-size:12px;padding:4px 0}
.cmp-quote{border-top:1px solid #E1E1E1;padding-top:10px;margin-top:4px;color:#000}
.sugg{position:absolute;left:44px;top:100%;width:340px;background:#fff;border-radius:6px;box-shadow:var(--sh16);padding:4px 0;z-index:30}
.sugg .sg{display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer}
.sugg .sg:hover,.sugg .sg.act{background:var(--hover)}
.sugg .sg .sn{font-weight:600;font-size:13px;line-height:18px}
.sugg .sg .se{font-size:12px;color:var(--fg3);line-height:16px}

/* layers: menus, tooltips, toasts, panels, dialogs */
#layer{position:fixed;inset:0;pointer-events:none;z-index:100}
#layer>*{pointer-events:auto}
.menu{position:fixed;background:#fff;border-radius:6px;box-shadow:var(--sh16);padding:4px;min-width:180px;max-width:340px;max-height:80vh;overflow-y:auto;z-index:120;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mitem{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:4px;cursor:pointer;white-space:nowrap;color:var(--fg1)}
.mitem:hover,.mitem.hot{background:var(--hover)}
.mitem .mic{width:20px;display:grid;place-items:center;color:var(--fg2)}
.mitem .mt{flex:1}
.mitem .msc{color:var(--fg3);font-size:12px;margin-left:16px}
.mitem .mck{width:16px;color:var(--fg1)}
.mitem.dis{color:var(--fgd);pointer-events:none}
.mitem.dis .mic{color:var(--fgd)}
.msep{height:1px;background:var(--s2);margin:4px -4px}
.mhdr{font-size:12px;font-weight:600;color:var(--fg2);padding:6px 8px 2px}
.catsw{width:14px;height:14px;border-radius:3px}
.tip{position:fixed;background:#fff;color:var(--fg1);font-size:12px;line-height:16px;padding:5px 10px 6px;border-radius:4px;box-shadow:var(--sh16);z-index:130;max-width:260px;pointer-events:none!important;animation:fade .1s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;box-shadow:var(--sh28);border-radius:8px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;z-index:110;min-width:280px;animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast .tt{flex:1;font-weight:600}
.toast .tl{color:var(--brand-hover);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:4px}
.toast .tl:hover{background:var(--hover)}
.notif{position:fixed;top:56px;right:16px;width:360px;background:#fff;border-radius:8px;box-shadow:var(--sh28);padding:12px 12px 14px 14px;display:flex;gap:12px;z-index:115;cursor:pointer;animation:notin .25s ease-out}
@keyframes notin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.notif.out{opacity:0;transform:translateX(24px);transition:.25s}
.notif .nb{flex:1;min-width:0}
.notif .nf{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .ns{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .np{color:var(--fg3);font-size:13px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notif .nx{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--fg2);flex:none}
.notif .nx:hover{background:var(--hover)}
.panel{position:fixed;top:48px;right:0;bottom:0;width:340px;background:#fff;box-shadow:var(--sh28);z-index:105;display:flex;flex-direction:column;animation:panin .18s ease-out}
@keyframes panin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel .ph{display:flex;align-items:center;height:56px;padding:0 8px 0 20px;flex:none}
.panel .ph h2{margin:0;font-size:20px;font-weight:600;flex:1}
.panel .pb{flex:1;overflow:auto;padding:0 20px 20px}
.ps-h{font-weight:600;margin:18px 0 8px}
.ps-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.ps-sub{font-size:12px;color:var(--fg3)}
.tog{width:40px;height:20px;border-radius:10px;border:1px solid var(--fg2);position:relative;flex:none;background:#fff}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg2);transition:left .12s}
.tog.on{background:var(--brand);border-color:transparent}
.tog.on::after{left:23px;background:#fff}
.radio{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}
.radio .rd{width:18px;height:18px;border-radius:50%;border:1px solid var(--fg2);display:grid;place-items:center;flex:none}
.radio.on .rd{border-color:var(--brand)}
.radio.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{height:40px;border-radius:6px;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--fg1)}
.ps-link{color:var(--brand-hover);font-weight:600;cursor:pointer;display:inline-block;margin-top:18px}
.pv-tabs{display:flex;gap:4px;margin:0 0 8px -10px}
.agenda .ag{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--s3)}
.agenda .ag .ab{width:4px;border-radius:2px;flex:none}
.agenda .ag .at{font-weight:600}
.agenda .ag .as{font-size:12px;color:var(--fg3)}
.todo{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--s3);cursor:pointer}
.todo .tc{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--fg3);flex:none;display:grid;place-items:center;color:#fff;margin-top:1px}
.todo.done .tc{background:var(--brand);border-color:var(--brand)}
.todo.done .tx{text-decoration:line-through;color:var(--fg3)}
.todo .td{font-size:12px;color:var(--fg3)}
.acct{position:fixed;top:48px;right:8px;width:320px;background:#fff;border-radius:0 0 8px 8px;box-shadow:var(--sh28);z-index:106;padding:16px 20px 18px}
.acct .ac-top{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2);margin-bottom:16px}
.acct .ac-me{display:flex;gap:16px;align-items:center}
.acct .ac-n{font-size:18px;font-weight:600}
.acct .ac-e{font-size:13px;color:var(--fg2)}
.acct a{font-size:13px;color:var(--brand-hover);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140;display:grid;place-items:center;animation:fade .12s}
.dialog{background:#fff;border-radius:8px;box-shadow:var(--sh64);width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;padding:24px;animation:pop .15s}
.dialog h2{margin:0 0 8px;font-size:20px;line-height:28px;font-weight:600}
.dialog .db{overflow:auto;flex:1;color:var(--fg1)}
.dialog .da{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.kbd{display:grid;grid-template-columns:1fr auto;gap:8px 24px;margin-top:8px}
.kbd kbd{font-family:inherit;font-size:12px;background:var(--bg4);border:1px solid var(--s2);border-radius:4px;padding:1px 6px}

/* calendar */
.calpane{flex:1;display:flex;min-width:0;min-height:0}
.cal-nav{width:236px;flex:none;overflow:auto;padding:4px 6px 16px 0}
.mini{padding:4px 8px 12px 6px}
.mini-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:6px;padding-left:4px}
.mini-h .icb{width:28px;height:28px}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px}
.mini-g .dn{color:var(--fg3);height:24px;line-height:24px}
.mini-g .dd{height:28px;line-height:28px;border-radius:50%;cursor:pointer;margin:1px}
.mini-g .dd:hover{background:var(--bg6)}
.mini-g .dd.out{color:var(--fg4)}
.mini-g .dd.wk{background:var(--brand-sel);border-radius:0}
.mini-g .dd.today{background:var(--brand);color:#fff;font-weight:600;border-radius:50%}
.calsec .citem{display:flex;align-items:center;gap:10px;height:32px;padding-left:28px;border-radius:4px;cursor:pointer}
.calsec .citem:hover{background:var(--bg6)}
.calsec .cbx{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;color:#fff}
.calmain{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:var(--sh2);overflow:hidden}
.cal-top{display:flex;align-items:center;gap:6px;height:52px;padding:0 12px;flex:none;border-bottom:1px solid var(--s3)}
.cal-top .ct-title{font-size:18px;font-weight:600;margin-left:8px;display:flex;align-items:center;gap:4px}
.cal-days{display:flex;flex:none;border-bottom:1px solid var(--s2);padding-right:12px}
.cal-days .gutter{width:64px;flex:none}
.cal-days .dh{flex:1;min-width:0;padding:8px 10px 6px;position:relative;border-left:1px solid var(--s3)}
.cal-days .dh .dnum{font-size:22px;font-weight:600;line-height:28px}
.cal-days .dh .dname{font-size:12px;color:var(--fg2)}
.cal-days .dh.today .dnum,.cal-days .dh.today .dname{color:var(--brand)}
.cal-days .dh.today::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand)}
.cal-scroll{flex:1;overflow-y:scroll;position:relative}
.cal-grid{display:flex;position:relative}
.cal-times{width:64px;flex:none}
.cal-times .tl{height:48px;font-size:11px;color:var(--fg3);text-align:right;padding-right:8px;position:relative;top:-8px}
.cal-col{flex:1;min-width:0;position:relative;border-left:1px solid var(--s3)}
.cal-col .hr{height:48px;border-top:1px solid var(--s2);position:relative}
.cal-col .hr::after{content:"";position:absolute;left:0;right:0;top:24px;border-top:1px dotted #E6E6E6}
.cal-col.wkend{background:#FAFAFA}
.cal-col .ev{position:absolute;border-radius:4px;padding:3px 6px;font-size:12px;line-height:15px;overflow:hidden;cursor:pointer;border-left:4px solid;box-shadow:0 0 0 1px #fff}
.cal-col .ev:hover{filter:brightness(.97)}
.cal-col .ev .et{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-col .ev .el{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-col .ev.tent{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 4px,transparent 4px 8px)!important}
.cal-col .ev.free{background:#fff!important}

function fitRibbon(items) {
  const wrap = $('#rbItems'); if (!wrap) return;
  RB_HIDDEN = [];
  const more = $('#rbMore');
  const order = items.map((it, i) => ({ it, i })).filter(x => x.it.p).sort((a, b) => a.it.p - b.it.p);
  const fits = () => wrap.scrollWidth <= wrap.clientWidth + 1;
  if (fits()) return;
  more.classList.remove('hidden');
  for (const { it, i } of order) {
    if (fits()) break;
    const el = wrap.querySelector(`[data-idx="${i}"]`); if (el) { el.classList.add('hidden'); RB_HIDDEN.push(it); }
  }
  // tidy up separators that ended up next to each other
  const kids = [...wrap.children].filter(e => !e.classList.contains('hidden'));
  kids.forEach((e, k) => { if (e.classList.contains('rb-sep') && (k === 0 || kids[k - 1].classList.contains('rb-sep') || e === kids[kids.length - 2])) e.classList.add('hidden'); });
}

let INC_I = 0;

}
function deliverNext() {

}

function scheduleFollowUp(sent, refId) {
  if (!CONFIG.followUps) return;
  const who = sent.to.find(k => PEOPLE[k] && !PEOPLE[k].sys && !PEOPLE[k].dl && !PEOPLE[k].ext && k !== 'me');
  if (!who) return;
  const subj = sent.subject || '(No subject)';
  if (who === 'grace') {
    setTimeout(() => deliver({ from: 'grace', to: ['me'], focused: true, font: 'aptos', subject: 'Automatic reply: ' + subj, body: `<p>Thank you for your email.</p><p>I am out of the office until Monday with limited access to email. For urgent HR matters, please contact People &amp; Culture at peopleandculture@contoso.com.</p><p>Best regards,<br>Grace Holloway</p>` }), 6000);
    return;
  }
  if (Math.random() > 0.75) return;
  setTimeout(() => {
    const first = nameOf('me').split(' ')[0];
    const body = pick(FOLLOWUPS).replace('Jordan', first) + `<p>${esc(nameOf(who).split(' ')[0])}</p>`;
    const conv = refId && byId(refId);

/* ============================================================

   ============================================================ */
const CATCOL = { blue: ['var(--brand-sel)', 'var(--brand)'], purple: ['#EDE4F7', '#8764B8'], green: ['#DFF6DD', '#107C10'], orange: ['#FDE7D9', '#CA5010'] };
const EXTRA_EVENTS = [];
const FILLER = ['Sync on the sync', 'Status update', 'Pre-meeting for the planning meeting', 'Checklist working session', 'Quarterly planning prep', 'Budget alignment', 'Process review', 'Stakeholder update', 'Template walkthrough', 'Action item review', 'Vendor check-in', 'Follow-up on follow-ups'];
const FILLER_SLOTS = [['10:30', '11:00'], ['11:00', '12:00'], ['13:30', '14:00'], ['14:00', '15:00'], ['15:00', '15:30'], ['16:00', '16:30']];
const pick2 = (arr, k) => arr[k % arr.length];
function calEventsFor(day) {
  const d0 = sod(day); const wd = (d0.getDay() + 6) % 7; // Mon=0
  const thisMon = addDays(sod(new Date()), -((new Date().getDay() + 6) % 7));
  const inThisWeek = sod(addDays(d0, -wd)).getTime() === thisMon.getTime();
  const at = (hm) => { const [h, m] = hm.split(':').map(Number); const x = new Date(d0); x.setHours(h, m, 0, 0); return x; };
  const out = [];
  for (const c of CAL) {
    if (c.d !== wd) continue;
    if (!inThisWeek && !c.rec) continue;
    const [bg, bd] = CATCOL[c.cat || 'blue'];
    out.push({ title: c.title, s: at(c.s), e: at(c.e), loc: c.loc, org: c.org, tent: !!c.tent, free: !!c.free, rec: !!c.rec, bg, color: bd });
  }
  for (const m of MAIL) {
    if (!m.invite || m.folder === 'deleted' || m.rsvp === 'Declined' || m.kind === 'response') continue;
    if (!sameDay(m.invite.startD, d0)) continue;
    const title = m.subject.replace(/^(Updated|Accepted): /, '');
    if (out.some(e => e.title === title && +e.s === +m.invite.startD)) continue;
    const idx = out.findIndex(e => e.title === title); if (idx >= 0) out.splice(idx, 1);
    out.push({ title, s: m.invite.startD, e: m.invite.endD, loc: m.invite.location, org: m.invite.organizer, tent: m.rsvp === 'Tentative' || (!m.rsvp && m.from !== 'me' && m.folder !== 'sent'), free: false, bg: CATCOL.blue[0], color: CATCOL.blue[1] });
  }
  if (!inThisWeek && wd < 5) {
    let h = 0; for (const ch of ymd(d0)) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
    const n = 1 + (h % 3);
    for (let i = 0; i < n; i++) {
      const k = (h >>> (i * 5)) ; const title = FILLER[k % FILLER.length]; const slot = FILLER_SLOTS[(k >>> 3) % FILLER_SLOTS.length];
      if (out.some(e => e.s.getHours() === +slot[0].slice(0, 2) || e.title === title)) continue;
      out.push({ title, s: at(slot[0]), e: at(slot[1]), loc: (k % 2) ? 'Microsoft Teams Meeting' : pick2(['Maple (4th floor)', 'Birch (4th floor)', 'Cedar (3rd floor)'], k), org: pick2(['priya', 'hannah', 'kenji', 'marcus', 'aisha', 'nate'], k >>> 2), tent: (k % 7) === 0, bg: CATCOL.blue[0], color: CATCOL.blue[1] });
    }
  }
  for (const e of EXTRA_EVENTS) if (sameDay(e.s, d0)) out.push(e);
  return out.sort((a, b) => a.s - b.s || b.e - a.e);
}
function calDays() {
  const base = sod(S.calDate);
  if (S.calView === 'day') return [base];
  const monday = addDays(base, -((base.getDay() + 6) % 7));
  if (S.calView === 'workweek') return [0, 1, 2, 3, 4].map(i => addDays(monday, i));
  const start = sow(base); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(start, i));
}
function renderCalendar() {
  const days = calDays(); const today = new Date();
  // nav pane: mini month
  const md = S.miniDate || S.calDate; const first = new Date(md.getFullYear(), md.getMonth(), 1);

    if ((el = t.closest('[data-qa]'))) { e.stopPropagation(); const id = el.closest('.mi').dataset.id; const qa = el.dataset.qa; hideTip(); if (qa === 'delete') doDelete([id]); else if (qa === 'read') { const m = byId(id); setRead([id], !m.read); } else if (qa === 'flag') toggleFlag([id]); else if (qa === 'pin') togglePin([id]); return; }

    if ((el = t.closest('[data-panel]'))) { togglePanel(el.dataset.panel, el.dataset.sub); return; }

    if ((el = t.closest('[data-rtab]'))) { S.rtab = el.dataset.rtab; renderRibbon(); return; }
    if ((el = t.closest('[data-fsec]'))) { S.fsec[el.dataset.fsec] = !S.fsec[el.dataset.fsec]; renderFolders(); return; }
    if ((el = t.closest('[data-folder]'))) { selectFolder(el.dataset.folder); return; }
    if ((el = t.closest('[data-tab]'))) { S.tab = el.dataset.tab; S.sel = null; S.checked.clear(); closeComposeIfAny(); refresh(); return; }
    if ((el = t.closest('[data-group]'))) { const g = el.dataset.group; S.collapsed[g] = !S.collapsed[g]; renderList(); return; }
    if ((el = t.closest('.sub-mi'))) { selectItem(el.dataset.subof, { expandMsg: el.dataset.mid }); return; }
    if ((el = t.closest('.mi'))) { if (e.ctrlKey || e.metaKey) { const id = el.dataset.id; if (S.checked.size === 0 && S.sel) S.checked.add(S.sel); S.checked.has(id) ? S.checked.delete(id) : S.checked.add(id); renderList(); renderReading(); renderRibbon(); return; } selectItem(el.dataset.id); return; }
    if ((el = t.closest('[data-expand]'))) { S.expanded[el.dataset.expand] = true; renderReading(); return; }
    if ((el = t.closest('[data-hist]'))) { $('#q_' + el.dataset.hist)?.classList.toggle('hidden'); return; }
    if ((el = t.closest('[data-rsvp]'))) { rsvp(el.dataset.id, el.dataset.rsvp); return; }
    if ((el = t.closest('[data-theme]'))) { S.theme = el.dataset.theme; applyLayout(); renderPanel(); return; }
    if ((el = t.closest('[data-mdtab]'))) { S.panelSub = el.dataset.mdtab; renderPanel(); return; }
    if ((el = t.closest('[data-todo]'))) { const td = TODOS[+el.dataset.todo]; td.done = !td.done; renderPanel(); return; }
    if ((el = t.closest('[data-sq]'))) { runSearch(el.dataset.sq); return; }
    if ((el = t.closest('[data-sopen]'))) { const id = el.dataset.sopen; closeSearchPop(); $('#sInput').blur(); const m = byId(id); if (S.module !== 'mail') switchModule('mail'); S.search = null; S.folder = m.folder; if (m.folder === 'inbox') S.tab = m.focused ? 'focused' : 'other'; selectItem(id); return; }
    if ((el = t.closest('[data-calev]'))) { eventPopover(el); return; }
    if ((el = t.closest('[data-mini]'))) { S.calScroll = $('#calScroll')?.scrollTop; S.calDate = new Date(el.dataset.mini + 'T12:00'); S.miniDate = null; renderCalendar(); return; }
    if ((el = t.closest('[data-pp]'))) { S.ppSel = el.dataset.pp; renderPeople(); return; }
    if ((el = t.closest('[data-gomail]'))) { const id = el.dataset.gomail; const m = byId(id); switchModule('mail'); S.folder = m.folder; S.tab = m.focused ? 'focused' : 'other'; selectItem(id); return; }
    if ((el = t.closest('#notif'))) { const id = el.dataset.open; el.remove(); const m = byId(id); if (!m) return; if (S.module !== 'mail') switchModule('mail'); S.search = null; S.folder = 'inbox'; S.tab = m.focused ? 'focused' : 'other'; selectItem(id); return; }
    if ((el = t.closest('#meAv'))) { toggleAcct(); return; }
  });
  document.addEventListener('contextmenu', e => {
    const mi = e.target.closest('.mi');
    if (mi) {
      e.preventDefault(); const id = mi.dataset.id;
      if (!S.checked.has(id)) { selectItem(id); }
      openMenu({ x: e.clientX, y: e.clientY }, itemContextMenu(byId(id)));
    }
  });
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) showTip(t); });
  document.addEventListener('mouseout', e => { const t = e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });

  // compose inputs
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-rc]')) { const v = t.value; if (/[;,]$/.test(v)) { if (!addRecipient(t.dataset.rc, v)) t.value = v.slice(0, -1); return; } showSugg(t.dataset.rc, v); return; }
    if (t.id === 'cmpSubj' || t.id === 'cmpBody') { readComposeDom(); autoSave(); return; }
    if (t.id === 'sInput') { renderSearchPop(); $('#sClear').classList.toggle('hidden', !t.value); return; }
    if (t.id === 'newFolderIn') return;
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t.matches && t.matches('[data-rc]')) {
      const sg = $('#sugg');
      if (sg && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); SUGG.idx = (SUGG.idx + (e.key === 'ArrowDown' ? 1 : -1) + SUGG.list.length) % SUGG.list.length; $$('.sg', sg).forEach((x, i) => x.classList.toggle('act', i === SUGG.idx)); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { if (sg && SUGG.list.length) { e.preventDefault(); addRecipient(t.dataset.rc, emailOf(SUGG.list[SUGG.idx])); return; } if (t.value.trim()) { e.preventDefault(); addRecipient(t.dataset.rc, t.value); return; } }
      if (e.key === 'Backspace' && !t.value && S.compose[t.dataset.rc].length) { S.compose[t.dataset.rc].pop(); renderRcpts(t.dataset.rc); return; }
      if (e.key === 'Escape') { hideSugg(); return; }
    }
    if (t.id === 'sInput') {
      if (e.key === 'Enter') { e.preventDefault(); runSearch(t.value); return; }
      if (e.key === 'Escape') { t.value = ''; closeSearchPop(); t.blur(); if (S.search) exitSearch(); return; }
      return;
    }
    if (t.id === 'newFolderIn') {
      if (e.key === 'Enter') { const v = t.value.trim(); S.newFolder = false; if (v) { const id = 'f_' + nid(); FOLDERS.push({ id, name: v, icon: 'folder', user: true }); toast(`Folder "${v}" created`); } renderFolders(); return; }
      if (e.key === 'Escape') { S.newFolder = false; renderFolders(); return; }
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter' && S.compose) { e.preventDefault(); send(); return; }
    const typing = t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    if (e.key === 'Escape') { if (MENUS.length) { closeMenus(); return; } if ($('.scrim')) { $('.scrim').remove(); return; } if ($('#evpop')) { $('#evpop').remove(); return; } if (S.panel) { closePanel(); return; } if (S.search && !typing) { exitSearch(); return; } return; }
    if (typing) return;
    if (S.module !== 'mail') return;
    const items = listItems().filter(m => !(m.pinned && false));
    const vis = $$('.mi').map(x => x.dataset.id);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!vis.length) return;
      const i = vis.indexOf(S.sel); const ni = i < 0 ? 0 : Math.max(0, Math.min(vis.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
      selectItem(vis[ni]); return;
    }
    if (e.key === 'Delete' || (e.key === 'Backspace' && !mod)) { e.preventDefault(); doDelete(); return; }
    if (e.key === 'Insert') { toggleFlag(); return; }
    if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); if (S.sel) startCompose(e.shiftKey ? 'replyAll' : 'reply'); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); if (S.sel) startCompose('forward'); return; }
    if (mod && e.key.toLowerCase() === 'q') { e.preventDefault(); setRead(selIds(), true); return; }
    if (mod && e.key.toLowerCase() === 'u') { e.preventDefault(); setRead(selIds(), false); return; }
    if (mod && e.key === '/') { e.preventDefault(); shortcutsDialog(); return; }
    if (!mod && (e.key === 'n' || e.key === 'N')) { startCompose('new'); return; }
    if (!mod && e.key === '/' || (e.altKey && e.key.toLowerCase() === 'q')) { e.preventDefault(); $('#sInput').focus(); return; }
    if (items && 0) return;
  });
  // search box focus
  document.addEventListener('focusin', e => { if (e.target.id === 'sInput') { $('#search').classList.add('focus'); renderSearchPop(); } });
  // splitter
  const sp = $('#splitter');
  sp.addEventListener('mousedown', e => {
    e.preventDefault(); const bottom = S.rp === 'bottom';
    const startX = e.clientX, startY = e.clientY; const lp = $('#lpane'); const w0 = lp.offsetWidth, h0 = lp.offsetHeight;
    const mv = ev => { if (bottom) lp.style.height = Math.max(160, Math.min(innerHeight - 260, h0 + ev.clientY - startY)) + 'px'; else document.documentElement.style.setProperty('--listw', Math.max(300, Math.min(innerWidth * .55, w0 + ev.clientX - startX)) + 'px'); };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); fitRibbon(ribbonItems()); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  // drag & drop to folders
  document.addEventListener('dragstart', e => { const mi = e.target.closest?.('.mi'); if (!mi) return; const id = mi.dataset.id; const ids = S.checked.has(id) ? [...S.checked] : [id]; e.dataTransfer.setData('text/plain', ids.join(',')); e.dataTransfer.effectAllowed = 'move'; });
  document.addEventListener('dragover', e => { const f = e.target.closest?.('[data-drop]'); if (!f) return; e.preventDefault(); $$('.fitem.drop').forEach(x => x !== f && x.classList.remove('drop')); f.classList.add('drop'); });
  document.addEventListener('dragleave', e => { const f = e.target.closest?.('[data-drop]'); if (f && !f.contains(e.relatedTarget)) f.classList.remove('drop'); });
  document.addEventListener('drop', e => { const f = e.target.closest?.('[data-drop]'); if (!f) return; e.preventDefault(); f.classList.remove('drop'); const ids = e.dataTransfer.getData('text/plain').split(',').filter(byId); if (ids.length && f.dataset.drop !== byId(ids[0]).folder) { if (f.dataset.drop === 'deleted') doDelete(ids); else moveTo(ids, f.dataset.drop); } });
  addEventListener('resize', debounce(() => { fitRibbon(ribbonItems()); closeMenus(); }, 120));
  // keep relative times fresh
  setInterval(() => { if (S.module === 'mail' && !document.hidden) { renderList(); } }, 60000);
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  renderHeader();
  applyLayout();
  // open the newest focused message, like Outlook does on launch
  const first = listItems()[0];
  if (first) { S.sel = first.id; first.read = true; }
  refresh();
  bindEvents();
  scheduleArrival(true);
}
init();

})();
</script>
</body>
</html>
